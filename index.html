<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1">  
  <title>Simple Roller</title>  
  <link rel="stylesheet" href="style.css">  
</head>  
<body>  
  
  <h1>Simple Roller</h1>  
  
  <canvas id="game" width="800" height="400"></canvas>  
  
  <p id="message">Loading... Wait A Second</p>  
  
  <p>  
    LEFT / RIGHT arrow to roll your ball &nbsp;&middot;&nbsp;  
    SPACE or UP arrow to jump &nbsp;&middot;&nbsp;  
    Push R to restart if you die, which definitely will happen  
  </p>  
  
  <!-- ===================================================================  
       THE ORDER OF THESE FILES MATTERS. Each one uses the ones above it.  
       If you add a new file, add it to this list too, in the right spot.  
       =================================================================== -->  
  <script src="js/config.js"></script>  
  <script src="js/input.js"></script>  
  <script src="js/level.js"></script>  
  <script src="js/collide.js"></script>  
  <script src="js/player.js"></script>  
  <script src="js/draw.js"></script>  
  <script src="js/crumble.js"></script>  
  <script src="js/game.js"></script>  
  <script src="js/main.js"></script>  
  
</body>  
</html>
